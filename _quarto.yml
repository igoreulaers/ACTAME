project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"

website:
  title: "ACTAME"
  site-url: "https://igoreulaers.github.io/ACTAME/"
  repo-url: "https://github.com/igoreulaers/ACTAME"
  description: >
    Arctic Conservation Tool for Area-based Measures and Ecosystems — a
    pan-Arctic area-based conservation planning tool developed under the joint
    PAME/CAFF project (2025–2027).
  favicon: assets/favicon.svg
  open-graph: true
  navbar:
    background: light
    logo: assets/actame-mark.svg
    logo-alt: "ACTAME"
    title: "ACTAME"
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: tools.qmd
        text: Tools
      - href: team.qmd
        text: Team & partners
      - href: publications.qmd
        text: Outputs
      - href: contact.qmd
        text: Contact
    right:
      - icon: github
        href: https://github.com/igoreulaers/ACTAME
        aria-label: ACTAME on GitHub
  page-footer:
    background: light
    left: |
      **ACTAME** — Arctic Conservation Tool for Area-based Measures and Ecosystems<br>
      A joint [PAME](https://pame.is/) / [CAFF](https://caff.is/) project (2025–2027),
      led by the [Norwegian Polar Institute](https://www.npolar.no/).
    right: |
      Basemaps © [Arctic SDI](https://arctic-sdi.org/)<br>
      Site source on [GitHub](https://github.com/igoreulaers/ACTAME) · content
      [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 250px

execute:
  freeze: auto
